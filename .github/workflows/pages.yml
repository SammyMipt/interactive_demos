# Сборка и публикация демонстраций на GitHub Pages.
# Запускается на каждый push в main, а также вручную из вкладки Actions.

name: Публикация на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Права для GITHUB_TOKEN: id-token нужен deploy-pages для OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Параллельные деплои не нужны, но начатый не отменяем, чтобы страница
# не осталась в недособранном состоянии.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      # enablement: true включает Pages сам, если в настройках репозитория
      # они ещё не включены, — руками щёлкать ничего не нужно.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
